   `<div class="note">↑只列该日视角近3个交易日的买卖，3天没有买入的席位隐藏；涨停/跌停/一字按所选复盘日当天涨跌幅（板块限制）；昨天涨停、今天没涨停则取消红色；D123%=(D1+D2+D3)/有效天数（买入、剔一字、缺省日不计）${HIST[d]?"":"（该日无快照，显示最新榜）"}</div>`+seatTable((SS.seats||[]).filter(hasBuy3), true));
 /* 1a 重点跟踪游资：分组块 + 与席位溢价同一套徽章 */
 if(YT&&YT.list&&YT.list.length){
  const actsOf=yt=>{
    if(yt.acts&&yt.acts.length) return yt.acts;
    const out=[];
    (yt.trades||[]).forEach(t=>{
      if((t.buy_yi||0)>0&&t.date) out.push({date:String(t.date).slice(5),code:t.code,name:t.name,yi:t.buy_yi,yz:!!t.yz,side:'buy',pct:t.day_pct!=null?t.day_pct:t.pct});
      if((t.sell_yi||0)>0&&t.sell_date) out.push({date:String(t.sell_date).slice(5),code:t.code,name:t.name,yi:t.sell_yi,yz:false,side:'sell',pct:t.sell_pct!=null?t.sell_pct:t.pct});
    });
    return out;
  };
  const yblocks=[];
  YT.list.forEach(yt=>{
    const st=yt.stat||{};
    const acts=actsOf(yt);
    if(!acts.some(b=>_win3.has(b.date)&&b.side!=='sell')) return;
    const wr=st.win_rate, d1a=st.d1_avg, d2a=st.d2_avg, d3a=st.d3_avg, ls=st.max_loss_streak;
    const wrCls=wr==null?'':(wr>=60?'up':'dn');
    yblocks.push(`<div class="yzg-block"><div class="yzg-head"><div class="yzg-head-top"><span class="yzg-name">${esc(yt.name)}</span>`
      +(wr==null?'':`<span class="kv">胜率 <b class="${wrCls}">${wr}%</b></span>`)
      +(ls==null?'':`<span class="kv">连败 <b class="dn">${ls}</b></span>`)
      +`</div>`+d123Line(d1a,d2a,d3a)+`</div>`+buyBadges(acts,{cols:4})+`</div>`);
  });
  if(yblocks.length){
    const win=(YT.list[0]&&YT.list[0].window)||25;
    h+=card(`重点跟踪游资（近3日买卖·战绩近${win}日）`,
      `<div class="note">胜率、连败和 D1 / D2 / D3 按近${win}日全部有效买入（剔一字；D2、D3 各按有数据的笔数均值）。涨停用淡红、跌停绿、一字黄，按所选复盘日当天涨跌幅（板块限制）；昨天涨停、今天没涨停则取消红色；今/昨/前只标文字不上色。3天没买的不显示。</div>`
      +`<div class="yzg">`+yblocks.join('')+`</div>`);
  }
 }

 /* 1b 标注游资 */
 const _kw=((SS.youzi&&SS.youzi.length)?SS.youzi:(SS.seats||[]).filter(s=>s.known)).filter(hasBuy3);
 if(_kw.length){
  h+=card(`标注游资（近3日买入·3天没买不显示·截至${SS.updated}）`, seatTable(_kw, true));
 }
 /* 2 当日龙虎榜 */
 h+=card('当日龙虎榜（净买 TOP30）',
   (x.lhb.n_multi?`<div class="note">※ 带 <span style="background:#eef2f8;border:1px solid #cfd9e6;border-radius:3px;padding:0 3px;color:#5b6b80">区</span> 为区间累计榜，不与单日同口径</div>`:'')+tbl(['股票','涨幅%','买(亿)','卖(亿)','净(亿)','高溢价买入席位'],
   x.lhb.stocks.map(s=>{const yz=!!s.yz;const dt=!yz&&_hitLim(s.pct,s.code,s.name,-1);const zt=!yz&&!dt&&_hitLim(s.pct,s.code,s.name,1);
     return [thsBadge(s,s.yz?' 一字':'',yz?'yz':(dt?'dtb':(zt?'zt':'')))+(s.multi?'<span style="display:inline-block;margin-left:3px;background:#eef2f8;border:1px solid #cfd9e6;border-radius:3px;padding:0 3px;font-size:10px;color:#5b6b80;vertical-align:1px">区</span>':''),s.pct==null?'--':`<span class="${s.pct>0?'up':'dn'}">${s.pct>0?'+':''}${s.pct}</span>`,s.buy,s.sell,`<b class="${s.net>0?'up':'dn'}">${s.net}</b>`,
     s.hi_seats&&s.hi_seats!=='--'?`<span class="up">${esc(s.hi_seats)}</span>`:'--'];})));
 /* 3 人气排行（左右并排，同一套列：# / 股票 / 涨幅 / 成交额） */
 const _hot=x.hot;
 const _hotEm=Array.isArray(_hot)?_hot:((_hot&&_hot.em)||[]);
 const _hotThs=Array.isArray(_hot)?[]:((_hot&&_hot.ths)||x.hot_ths||[]);
 const _hotMeta=(!Array.isArray(_hot)&&_hot&&_hot.meta)||{};
 const _hotCols=['#','股票','涨幅','亿'];
 const _hotCellName=s=>{
   const cls=s.yz?'hot-yz':(s.dt?'hot-dt':(s.zt?'hot-zt':''));
   const a=thsLink(s.name,s.code);
   return cls?a.replace('class="ths-stock"','class="ths-stock '+cls+'"'):a;
 };
 const _hotCellPct=s=>s.pct==null?'--':`<span class="${s.pct>0?'up':'dn'}">${s.pct>0?'+':''}${s.pct}%</span>`;
 const _hotRow=s=>[`<span class="dim">${s.rank||''}</span>`,_hotCellName(s),_hotCellPct(s),s.amt==null?'--':s.amt];
 if(_hotEm.length||_hotThs.length){
  const _thsLab=_hotMeta.ths_period?(_hotMeta.ths_period==='day'?'24h':'小时'):'';
  let hb=`<div class="note">左东财 · 右同花顺${_hotMeta.fetched_at?' · 抓取 '+esc(_hotMeta.fetched_at):''}</div>`
   +'<div class="hot-grid">';
  hb+='<div class="hot-col"><h3>东财'+(_hotEm.length?' TOP'+_hotEm.length:'')+'</h3>'
   +(_hotEm.length?tbl(_hotCols,_hotEm.map(_hotRow),'hot-tbl'):'<div class="note">无数据</div>')+'</div>';
  hb+='<div class="hot-col"><h3>同花顺'+(_hotThs.length?' TOP'+_hotThs.length:'')+(_thsLab?`（${_thsLab}）`:'')+'</h3>'
   +(_hotThs.length?tbl(_hotCols,_hotThs.map(_hotRow),'hot-tbl'):'<div class="note">无数据</div>')+'</div></div>';
  h+=card('当日人气排行', hb);
 }else{
  h+=card('当日人气排行','<div class="note">该日期无存档（人气榜仅有实时快照，无法回补）</div>');
 }
 /* 4 情绪分析 */
 h+=card('情绪分析结论', x.analysis.map(t=>'· '+esc(t)).join('<br>'), 'anl');
 /* 5 D1 涨停溢价 */
 if(x.d1){const f=o=>o?`<b class="${o.avg>0?'up':'dn'}">${o.avg>0?'+':''}${o.avg}%</b>`:'--';
  const up2=o=>o==null?'--':((o.up2!=null?o.up2:o.win)+'%');
  const row=(k,o)=>o?[k,o.n,f(o),up2(o),`<span class="${o.median>0?'up':'dn'}">${o.median>0?'+':''}${o.median}%</span>`]:null;
  const rows=[row('全部',x.d1.all),row('剔一字',x.d1.ex_yizi),row('仅连板股',x.d1.lb),row('首板剔一字',x.d1.fb)].filter(Boolean);
  const _dsrc=x.d1.src||((DATA.meta&&DATA.meta.d1_src)||'');
  h+=card('涨停溢价（昨日涨停→今日）', (_dsrc?`<div class="note">D1 源：${esc(_dsrc)}（Baostock）</div>`:'')+tbl(['口径','样本','D1均值','>2%占比','中位数'],rows));}
 /* 6 涨停梯队（按合并题材分组·紧凑：标签与筹码同行） */
 h+=card('涨停梯队', x.ladder.map(L=>{
  const groups={}, order=[];
  (L.stocks||[]).forEach(s=>{
   const fallback=(s.theme&&String(s.theme).trim())||(s.hybk&&String(s.hybk).trim())||'未标注';
   const ts=(Array.isArray(s.themes)&&s.themes.length)?s.themes:[fallback];
   ts.forEach(function(raw){
    const k=String(raw||'').trim()||fallback;
    if(!groups[k]){groups[k]=[];order.push(k)}
    groups[k].push(s);
   });
  });
  order.sort((a,b)=>groups[b].length-groups[a].length||String(a).localeCompare(String(b),'zh'));
  return `<div class="ladder-block"><h3>${L.lb}板 ×${(L.stocks||[]).length}</h3>`+
   order.map(k=>`<div class="ladder-theme"><span class="ladder-theme-h">${esc(k)}·${groups[k].length}</span>`+
    groups[k].map(s=>thsBadge(s,(s.yz?' 一字':'')+(s.zbc?`<span class="dn">(${s.zbc}炸)</span>`:''))+ntagHtml(s.name,s.code,d)).join('')+
   `</div>`).join('')+'</div>';
 }).join(''));
 /* 7 板块驱动：有概念榜 AI 分板块时用它展示；否则回退旧行业表。不改 sectors 打分数据。 */
 const _cb=(x.concept_board&&x.concept_board.groups)||[];
 if(_cb.length){
  h+=card('板块驱动（概念榜涨停·相近合并）', tbl(['板块','家数','组成'],
    _cb.map(s=>{
      const names=(s.stocks||[]).map(t=>{
        let ex='';
        if(t.yz && (t.lb||1)>=2) ex='（'+t.lb+'板一字）';
        else if(t.yz) ex='（一字）';
        else if((t.lb||1)>=2) ex='（'+t.lb+'板）';
        return thsLink(t.name,t.code,ex);
      }).join('、');
      const note=s.note?`<div class="dim" style="margin-top:2px">${esc(s.note)}</div>`:'';
      return [esc(s.name),s.n,`<span style="color:#1f2329">${names||esc(s.reason||'--')}</span>${note}`];
    })));
 } else {
  h+=card('板块驱动（涨停行业·上涨理由）', tbl(['板块','涨停数','上涨理由'],
    (x.sectors||[]).map(s=>[esc(s.name),s.n,`<span style="color:#1f2329">${esc(s.reason||'--')}</span>`])));
 }
 root.innerHTML=h;
}
if(dp.options.length){try{render(dp.options[0].value)}catch(e){root.innerHTML='<div class="card" style="color:#c62828">渲染出错: '+e.message+'<br>'+(e.stack||'').replace(/</g,'&lt;').split(String.fromCharCode(10)).slice(0,5).join('<br>')+'</div>'}}
dp.addEventListener('change',function(){try{render(dp.value)}catch(e){root.innerHTML='<div class="card" style="color:#c62828">渲染出错: '+e.message+'</div>'}window.scrollTo(0,0)});
window.addEventListener('error',function(ev){try{root.innerHTML='<div class="card" style="color:#c62828">脚本错误: '+ev.message+'</div>'}catch(_){}});
function doRefresh(){
  var b=document.getElementById('rf');
  var old=b.textContent;
  b.disabled=true;b.textContent='正在请求刷新…';
  var n=0;var tick=setInterval(function(){b.textContent='正在请求刷新'+'.'.repeat(++n%4)},500);
  /* 仅本机 serve_board 提供 /refresh；公网静态页(deed)无法直接跑脚本 */
  fetch('/refresh',{method:'POST'}).then(function(r){return r.json()}).then(function(j){
    clearInterval(tick);
    if(j.ok){b.textContent='完成'+(j.sec?j.sec+'s':'');location.reload();return;}
    b.textContent='失败';alert('刷新失败：'+(j.msg||''));
    b.disabled=false;
  }).catch(function(){
    clearInterval(tick);
    b.textContent='需机器人刷新';
    alert('「刷新数据」= 跑当日复盘。'+String.fromCharCode(10)+String.fromCharCode(10)
      +'当前是公网静态页，浏览器不能直接执行本机脚本。'+String.fromCharCode(10)
      +'请在聊天对我说：刷新复盘 / 跑当日复盘'+String.fromCharCode(10)
      +'或本机执行：python3 scripts/refresh_board.py'+String.fromCharCode(10)+String.fromCharCode(10)
      +'完成后刷新本页即可看到最新数据。');
    setTimeout(function(){b.disabled=false;b.textContent=old;},2500);
  });
  setTimeout(function(){clearInterval(tick);if(b.disabled){b.disabled=false;b.textContent=old;}},300000);
}
